<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700"
     role="img" aria-label="ChargeSentry">
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E9FBF3"/>
      <stop offset="100%" stop-color="#6FD3AC"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#B7EDD4"/>
    </linearGradient>
  </defs>
  <g transform="translate(194,20)">
  <g>
    <!-- arch badge: navy outline, white ring, mint field -->
    <path d="M40,256 A216,216 0 0 1 472,256 L472,424 A32,32 0 0 1 440,456 L72,456
             A32,32 0 0 1 40,424 Z"
          fill="#FFFFFF" stroke="#0E2233" stroke-width="18" stroke-linejoin="round"/>
    <path d="M74,256 A182,182 0 0 1 438,256 L438,414 A16,16 0 0 1 422,430 L90,430
             A16,16 0 0 1 74,414 Z"
          fill="url(#field)" stroke="#0E2233" stroke-width="10" stroke-linejoin="round"/>

    <!-- charge post -->
    <rect x="212" y="112" width="88" height="150" rx="22"
          fill="#FFFFFF" stroke="#0E2233" stroke-width="12"/>
    <path d="M212,196 L176,196 A16,16 0 0 0 160,212 L160,268"
          fill="none" stroke="#0E2233" stroke-width="12" stroke-linecap="round"/>
    <path d="M300,196 L336,196 A16,16 0 0 1 352,212 L352,268"
          fill="none" stroke="#0E2233" stroke-width="12" stroke-linecap="round"/>
    <circle cx="256" cy="163" r="31" fill="#0E2233"/>
    <path d="M262,141 L242,171 L254,171 L250,190 L271,159 L258,159 Z" fill="#FFFFFF"/>

    <!-- car -->
    <path d="M96,382 L96,344 A22,22 0 0 1 112,323 L166,308 L204,266
             A26,26 0 0 1 223,258 L310,258 A26,26 0 0 1 330,267 L368,310 L404,322
             A22,22 0 0 1 420,343 L420,382 A14,14 0 0 1 406,396 L110,396
             A14,14 0 0 1 96,382 Z"
          fill="url(#body)" stroke="#0E2233" stroke-width="13" stroke-linejoin="round"/>
    <path d="M225,282 L305,282 A14,14 0 0 1 316,287 L346,318 L186,318 L214,288
             A14,14 0 0 1 225,282 Z" fill="#0E2233"/>
    <path d="M258,282 L258,318" stroke="url(#field)" stroke-width="9"/>
    <rect x="108" y="336" width="34" height="15" rx="7" fill="#FFFFFF" stroke="#0E2233" stroke-width="7"/>
    <circle cx="164" cy="396" r="36" fill="#0E2233"/>
    <circle cx="164" cy="396" r="15" fill="#6FD3AC"/>
    <circle cx="356" cy="396" r="36" fill="#0E2233"/>
    <circle cx="356" cy="396" r="15" fill="#6FD3AC"/>
  </g>
  </g>
  <text x="450" y="656" text-anchor="middle"
        font-family="Montserrat, 'DejaVu Sans', 'Helvetica Neue', Arial, sans-serif"
        font-size="96" font-weight="700" letter-spacing="1" fill="#17877A">ChargeSentry</text>
</svg>
